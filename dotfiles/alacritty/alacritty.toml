# ~/.config/alacritty/alacritty.toml — transparente (blur vem do SwayFX)
# Cores: geradas pelo wallust a partir do wallpaper (importadas abaixo)

[general]
import = ["~/.cache/wallust/alacritty.toml"]

[window]
opacity = 0.85
padding = { x = 12, y = 10 }
dynamic_padding = true

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
size = 11

# Cursor em linha fina (não o bloco)
[cursor]
style = { shape = "Beam", blinking = "On" }
vi_mode_style = { shape = "Block", blinking = "Off" }
blink_interval = 600
thickness = 0.12
unfocused_hollow = true

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
