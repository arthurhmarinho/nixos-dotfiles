# ~/.config/mpv/mpv.conf
# Vídeo: renderizador moderno + decodificação pela GPU
vo=gpu-next
hwdec=vaapi                    # RX580: VAAPI (a GPU não tem decodificação Vulkan)

# Janela e reprodução
keep-open=yes                  # não fecha ao terminar o vídeo
save-position-on-quit=yes      # continua de onde parou
autofit-larger=85%x85%         # vídeos grandes abrem em até 85% da tela
screenshot-directory=~/Pictures/Screenshots
screenshot-format=png

# Áudio e legendas em português primeiro
alang=pt-BR,pt,por,en,eng
slang=pt-BR,pt,por,en,eng
volume-max=150

# OSD (barra de progresso, volume) — cores do tema, geradas pelo wallust
osd-font="JetBrainsMono Nerd Font"
osd-font-size=28
osd-border-size=2
osd-bar-h=2.5
include="~/.cache/wallust/mpv.conf"
