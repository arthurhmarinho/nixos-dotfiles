# ~/.config/waypaper/config.ini — seletor de wallpapers (menu de Configurações)
# backend = none: o waypaper só mostra as miniaturas; quem aplica o wallpaper e
# gera as cores é o post_command (wallpaper.sh), com o $wallpaper escolhido.
# O waypaper regrava esta cópia em ~/.config ao fechar (perde os comentários).
[Settings]
folder = ~/Pictures/Wallpapers
backend = none
post_command = ~/.config/sway/scripts/wallpaper.sh set "$wallpaper"
fill = fill
sort = name
number_of_columns = 3
subfolders = False
show_hidden = False
use_xdg_state = False
